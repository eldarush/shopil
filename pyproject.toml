[project]
name = "shopil"
version = "0.1.0"
description = "Evidence-grounded Hebrew business assistant for ShopIL"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb==1.5.6",
    "gradio>=6,<7",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
