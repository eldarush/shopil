[project]
name = "shopil"
version = "1.0.1"
description = "Evidence-grounded Hebrew business assistant for ShopIL"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb==1.5.6",
    "gradio>=6,<7",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
]

[dependency-groups]
batch = ["dlt[duckdb]==1.32.0", "dbt-core==1.12.7", "dbt-duckdb==1.11.1"]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
