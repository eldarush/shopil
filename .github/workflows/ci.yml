name: Application CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    name: Application tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
      - run: python -m pip install uv==0.11.26
      - run: uv sync --locked
      - run: uv sync --project streaming --locked
      - run: uv run --locked python -m pytest -q
      - run: uv run --directory streaming --locked python -m pytest -q
      - run: uv run --locked python -m integration.smoke
